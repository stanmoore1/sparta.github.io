# Preview of sparta.github.io with a manual built from a work branch.
#
# Lives only on the doc-preview branch of a fork; it is not meant to be
# merged into the live site.  The site pages are taken as they are in this
# branch (the published Sphinx build), and doc/ is replaced with the manual
# built from the chosen branch of the SPARTA repository -- keeping
# doc/Manual.pdf, which the HTML build does not produce.
#
# Served at https://<user>.github.io/sparta.github.io/.  Every link the
# site writes is relative, so the repository-name prefix costs nothing.

name: preview

on:
  push:
    branches: [doc-preview]
  workflow_dispatch:
    inputs:
      repository:
        description: 'SPARTA repository to build the manual from'
        default: 'stanmoore1/sparta'
      ref:
        description: 'Branch of that repository'
        default: 'doc-lammps-features'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      MANUAL_REPO: ${{ github.event.inputs.repository || 'stanmoore1/sparta' }}
      MANUAL_REF: ${{ github.event.inputs.ref || 'doc-lammps-features' }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/checkout@v4
      with:
        repository: ${{ env.MANUAL_REPO }}
        ref: ${{ env.MANUAL_REF }}
        path: sparta

    - name: Build the manual
      run: make -C sparta/doc html SPHINXEXTRA="-W --keep-going"

    - name: Check the manual's own links
      run: python3 sparta/doc/utils/link-check.py sparta/doc/html

    - name: Assemble the site with the new manual
      run: |
        set -euo pipefail
        mkdir site
        git archive HEAD | tar x -C site
        rm -rf site/.github
        cp site/doc/Manual.pdf manual.pdf
        rm -rf site/doc
        mkdir site/doc
        cp -a sparta/doc/html/. site/doc/
        cp manual.pdf site/doc/Manual.pdf
        touch site/.nojekyll

    - name: Check the links from the site into the manual
      run: python3 utils/link-check.py site

    - name: Record what was built
      run: |
        {
          echo "Manual: $MANUAL_REPO@$MANUAL_REF ($(git -C sparta rev-parse --short HEAD))"
          echo "Site: $(git rev-parse --short HEAD)"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
